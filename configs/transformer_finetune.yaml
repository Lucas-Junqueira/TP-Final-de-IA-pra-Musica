# Fase 2: ajuste fino no EMOPIA+ com token de emoção e dropout de condição
out_dir: runs/transformer_finetune
model:                # precisa ser igual ao do pré-treino
  type: transformer
  n_layers: 6
  d_model: 256
  n_heads: 8
  ff_mult: 4
  max_len: 1024
  dropout: 0.1
data:
  dataset: emopia
  batch_size: 16
  cond_dropout: 0.15
  max_shift: 3
  num_workers: 0   # workers no Windows custam ~0,5-1 GB de RAM cada
train:
  init_from: runs/transformer_pretrain/best.pt
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  min_lr_ratio: 0.1
  max_steps: 5000     # ~55 épocas de 91 passos
  grad_clip: 1.0
  eval_every: 200
  patience: 5         # early stopping pela validação
  amp: true
  seed: 0
