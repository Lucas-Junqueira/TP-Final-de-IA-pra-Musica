# Ablação (opcional): Transformer treinado só no EMOPIA+, sem pré-treino
out_dir: runs/transformer_scratch
model:
  type: transformer
  n_layers: 6
  d_model: 256
  n_heads: 8
  ff_mult: 4
  max_len: 1024
  dropout: 0.1
data:
  dataset: emopia
  batch_size: 16
  cond_dropout: 0.15
  max_shift: 3
  num_workers: 0   # workers no Windows custam ~0,5-1 GB de RAM cada
train:
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  min_lr_ratio: 0.1
  max_steps: 5000
  grad_clip: 1.0
  eval_every: 200
  patience: 5
  amp: true
  seed: 0
